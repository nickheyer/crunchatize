<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crunchling Adventure</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font-family: sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: min(100vw, calc(100vh * 4 / 3)); aspect-ratio: 4 / 3; container-type: size; }
  #game { display: block; width: 100%; height: 100%; image-rendering: pixelated; cursor: none; touch-action: none; background: #000; outline: none; }
  #credits { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5cqh; pointer-events: none; }
  #credits[hidden] { display: none; }
  #credits a { pointer-events: auto; color: #fff; text-decoration: none; }
  #credits img { display: block; width: 28cqh; height: 28cqh; border-radius: 50%; }
  #credits .name { font: 600 7cqh/1 Poppins, sans-serif; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" tabindex="0"></canvas>
  <div id="credits" hidden>
    <a href="https://github.com/nickheyer" target="_blank" rel="noopener"><img src="https://github.com/nickheyer.png?size=240" alt="Nicholas W. Heyer"></a>
    <a class="name" href="https://github.com/nickheyer" target="_blank" rel="noopener">Nicholas W. Heyer</a>
    <script type="text/javascript" src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js" data-name="bmc-button" data-slug="nickheyer" data-color="#BD5FFF" data-emoji="☕"  data-font="Poppins" data-text="Buy me a coffee" data-outline-color="#000000" data-font-color="#ffffff" data-coffee-color="#FFDD00" ></script>
  </div>
</div>
<script type="module">
  import init, { start } from './pkg/crunch_web.js';
  await init();
  await start(document.getElementById('game'), document.getElementById('credits'), './data/', './worklet.js');
</script>
</body>
</html>
