[package]
name = "crunch-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
avmanager = { path = "../avmanager" }
crunch = { path = "../crunch" }
crunch-pak = { path = "../crunch-pak" }
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AudioContext",
    "AudioContextOptions",
    "AudioContextState",
    "AudioWorklet",
    "AudioWorkletNode",
    "AudioWorkletNodeOptions",
    "AudioDestinationNode",
    "BaseAudioContext",
    "Cache",
    "CacheStorage",
    "CanvasRenderingContext2d",
    "Document",
    "DomRect",
    "Element",
    "EventTarget",
    "Headers",
    "HtmlCanvasElement",
    "HtmlElement",
    "ImageData",
    "KeyboardEvent",
    "Location",
    "MessagePort",
    "MouseEvent",
    "Navigator",
    "Performance",
    "PointerEvent",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
    "Request",
    "Response",
    "Storage",
    "Url",
    "Window",
    "Worklet",
    "console",
] }
